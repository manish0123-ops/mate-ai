
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATE — Your Workspace</title>
    <link rel="stylesheet" href="./static/style.css">
<body>
    <main class="app" id="app">

        <header class="topbar">
            <div class="profile">
                <div class="profile-avatar">MR</div>
                <span class="profile-name">Manish Reddy</span>
            </div>
            <div class="brand">MATE</div>
        </header>

        <section class="welcome" id="welcome">
            <h1 id="greeting">Good afternoon, Manish</h1>
            <p>What would you like to work on today?</p>
        </section>

        <section
            class="conversation"
            id="conversation"
            aria-live="polite"
        ></section>

        <div class="composer-area" id="composer-area">
            <form class="composer" id="chat-form">
                <textarea
                    id="message-input"
                    rows="1"
                    placeholder="Ask MATE anything..."
                    aria-label="Ask MATE anything"
                ></textarea>
                  
                <button
                   type="button"
                   id="mic-button"
                   aria-label="Start voice input"
                   title="Start voice input">
                   <svg viewBox="0 0 24 24" aria-hidden="true">
                       <rect x="9" y="3" width="6" height="12" rx="3"></rect>
                       <path d="M5 11a7 7 0 0 0 14 0"></path>
                       <path d="M12 18v3M9 21h6"></path>
                   </svg>
                </button>
                

                <button type="submit" id="send-button" aria-label="Send message">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 19V5M5 12l7-7 7 7"></path>
                    </svg>
                </button>
            </form>

            <div class="keyboard-hint" id="keyboard-hint">
                Press Enter to send, Shift + Enter for a new line
            </div>

            <div class="error-message" id="error-message"></div>
        </div>

    </main>

    <script src="./static/script.js"></script>
</body>
</html>
